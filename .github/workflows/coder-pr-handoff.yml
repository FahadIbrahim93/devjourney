# Agency handoff: when a PR says "Closes #N" (or Fixes/Resolves), comment on issue #N once
# and add the label status:in-review. Free tier: GITHUB_TOKEN only, runs in ~10s.
# Board status moves are done by the project's built-in workflows (enable in the UI; see docs/WORKFLOW.md).
name: coder-pr-handoff
on:
  pull_request:
    types: [opened, reopened, edited, ready_for_review]
permissions:
  issues: write
  pull-requests: read
jobs:
  handoff:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const text = `${pr.title}\n${pr.body || ''}`;
            const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)\b/gi;
            const nums = [...new Set([...text.matchAll(re)].map(m => Number(m[1])))];
            if (!nums.length) { core.notice('No "Closes #N" found; nothing to hand off.'); return; }
            const { owner, repo } = context.repo;
            const marker = `<!-- handoff:pr-${pr.number} -->`;
            // make sure the label exists (idempotent)
            try { await github.rest.issues.getLabel({ owner, repo, name: 'status:in-review' }); }
            catch { await github.rest.issues.createLabel({ owner, repo, name: 'status:in-review',
                    color: 'fbca04', description: 'A PR claims to close this issue; waiting for Hope review' }); }
            for (const n of nums) {
              let issue;
              try { issue = (await github.rest.issues.get({ owner, repo, issue_number: n })).data; }
              catch { core.warning(`#${n} not found`); continue; }
              if (issue.pull_request) continue;              // it's a PR, not an issue
              const comments = await github.paginate(github.rest.issues.listComments,
                                 { owner, repo, issue_number: n, per_page: 100 });
              if (!comments.some(c => (c.body || '').includes(marker))) {
                await github.rest.issues.createComment({ owner, repo, issue_number: n, body:
                  `${marker}\n🔁 **Handoff:** PR #${pr.number} by @${pr.user.login} claims to close this issue.\n` +
                  `- Preview / checks: see the PR\n- Next: Hope reviews and merges (merge closes this issue → board **Done**).` });
              }
              await github.rest.issues.addLabels({ owner, repo, issue_number: n, labels: ['status:in-review'] });
              core.info(`#${n}: commented + labelled`);
            }
