# TOOLS.yaml — Snaptrap Stylist
# Tools enabled for the [SNAPTRAP] venture clone (PRIVACY: local model)

profile: snaptrap_stylist
venture: [SNAPTRAP]
model:
  primary: ollama/llama3.1:8b     # LOCAL for drop secrets, design data
  fallback: google/gemini-2.5-flash
  local: ollama/llama3.1:8b

tools:
  enabled:
    - web_search       # Trend research, culture tracking
    - browser          # TikTok, Instagram, Twitter, suppliers
    - file_access      # Designs, brand guidelines, sales
    - image_generation # Mockups, social creatives, concept art
    - cron_scheduler   # Drop countdowns, daily engagement reports

  permissions:
    web_search: full
    browser: full
    file_access:
      read:
        - ~/.hermes/profiles/snaptrap_stylist/designs/
        - ~/.hermes/profiles/snaptrap_stylist/sales/
      write:
        - ~/.hermes/profiles/snaptrap_stylist/content/
        - ~/.hermes/profiles/snaptrap_stylist/designs/
    image_generation: full
    cron_scheduler: full

mcp_servers:
  - name: shopify-mcp
    purpose: Products, orders, analytics
    auth: shopify_admin_api
  - name: tiktok-mcp
    purpose: Content scheduling, analytics
    auth: tiktok_business_api
  - name: pinterest-mcp
    purpose: Pin creation, trend discovery
    auth: pinterest_api
  - name: twitter-mcp
    purpose: Threads, engagement, community
    auth: twitter_api_v2

memory_namespace:
  private: ~/.hermes/profiles/snaptrap_stylist/  # DROP SECRETS STAY LOCAL
  shared: ~/.hermes/shared/insights/SNAPTRAP/    # Public insights only

daily_routines:
  - time: "10:00"
    task: "Drop countdown check + engagement pulse"
  - time: "14:00"
    task: "Community management + UGC curation"
  - time: "21:00"
    task: "Drop tease prep + tomorrow's content plan"

skills:
  - trend_forecaster
  - drop_planner
  - community_builder
  - visual_identity_guard
  - collab_scout
  - pod_optimizer
