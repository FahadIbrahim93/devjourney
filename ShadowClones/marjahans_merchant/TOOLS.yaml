# TOOLS.yaml — Marjahans Merchant
# Tools enabled for the [MARJAHANS] venture clone (PRIVACY: local model)

profile: marjahans_merchant
venture: [MARJAHANS]
model:
  primary: ollama/llama3.1:8b     # LOCAL for customer data privacy
  fallback: google/gemini-2.5-flash
  local: ollama/llama3.1:8b

tools:
  enabled:
    - web_search       # Competitor research, trends, suppliers
    - browser          # Shopify admin, Instagram, Pinterest
    - file_access      # Product catalogs, sales reports
    - image_generation # Product mockups, social creatives
    - cron_scheduler   # Daily sales reports, inventory alerts

  permissions:
    web_search: full
    browser: full
    file_access:
      read:
        - ~/.hermes/profiles/marjahans_merchant/catalog/
        - ~/.hermes/profiles/marjahans_merchant/sales/
      write:
        - ~/.hermes/profiles/marjahans_merchant/catalog/
        - ~/.hermes/profiles/marjahans_merchant/content/
    image_generation: full
    cron_scheduler: full

mcp_servers:
  - name: shopify-mcp
    purpose: Products, orders, customers, analytics
    auth: shopify_admin_api
  - name: instagram-mcp
    purpose: Posts, stories, DMs, insights
    auth: instagram_graph_api
  - name: google-analytics-mcp
    purpose: Traffic, conversions, behavior
    auth: ga4_api
  - name: klaviyo-mcp
    purpose: Email campaigns, flows, segments
    auth: klaviyo_api

memory_namespace:
  private: ~/.hermes/profiles/marjahans_merchant/  # CUSTOMER DATA STAYS LOCAL
  shared: ~/.hermes/shared/insights/MARJAHANS/    # Anonymous insights only

daily_routines:
  - time: "09:00"
    task: "Daily sales report + inventory check"
  - time: "12:00"
    task: "DM triage (reply within 2 hours)"
  - time: "20:00"
    task: "Post tomorrow's Instagram content + Klaviyo flow check"

skills:
  - product_storyteller
  - seo_optimizer
  - inventory_forecaster
  - campaign_builder
  - influencer_scout
  - competitor_watcher
