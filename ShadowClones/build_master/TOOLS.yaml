# TOOLS.yaml — Build Master
# Tools enabled for the [BUILD] venture clone

profile: build_master
venture: [BUILD]
model:
  primary: kimi/moonshot-v1-128k    # Long context for proposals, SOWs
  fallback: google/gemini-2.5-pro
  local: ollama/llama3.1:8b

tools:
  enabled:
    - web_search       # Supplier research, regulations
    - browser          # Supplier portals, government sites
    - file_access      # Proposals, contracts, project docs, contacts
    - code_exec        # Cost calculators, project trackers, financial models
    - cron_scheduler   # Follow-up reminders, milestone checks, daily reports

  permissions:
    web_search: full
    browser: full
    file_access:
      read:
        - ~/.hermes/profiles/build_master/proposals/
        - ~/.hermes/profiles/build_master/contacts/
      write:
        - ~/.hermes/profiles/build_master/proposals/
        - ~/.hermes/profiles/build_master/projects/
    code_exec: full
    cron_scheduler: full

mcp_servers:
  - name: notion-mcp
    purpose: Project wikis, databases, meeting notes
    auth: notion_integration_token
  - name: google-sheets-mcp
    purpose: Cost tracking, timelines, CRM
    auth: google_service_account
  - name: google-calendar-mcp
    purpose: Scheduling, reminders, follow-ups
    auth: google_calendar_api
  - name: slack-mcp
    purpose: Team communication, client channels
    auth: slack_bot_token

memory_namespace:
  private: ~/.hermes/profiles/build_master/  # CLIENT DATA STAYS LOCAL
  shared: ~/.hermes/shared/insights/BUILD/   # Anonymous insights only

daily_routines:
  - time: "08:00"
    task: "Follow-up queue check (proposals, milestones)"
  - time: "13:00"
    task: "Network outreach + warm intro follow-ups"
  - time: "18:00"
    task: "Daily project health report + tomorrow's priorities"

skills:
  - proposal_writer
  - project_scoper
  - network_manager
  - cost_estimator
  - permit_navigator
  - innovation_scout
