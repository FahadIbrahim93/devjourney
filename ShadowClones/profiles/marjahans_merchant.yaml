# ═══════════════════════════════════════════════════════════════════
# Profile: marjahans_merchant
# Purpose: [MARJAHANS] venture — jewelry e-com (CUSTOMER DATA = PRIVATE)
# Created: 2026-06-06 · Updated: 2026-06-07 (free models)
# ═══════════════════════════════════════════════════════════════════

name: marjahans_merchant
description: "Story curator + inventory manager for jewelry e-com. [MARJAHANS] venture. 100% LOCAL by default."

# ─── MODEL CONFIGURATION (FREE TIER — LOCAL FIRST) ──────────────
model:
  # Ollama local: privacy is non-negotiable for customer data
  default: "ollama/llama3.1:8b"
  provider: ollama
  base_url: "http://localhost:11434/v1"
  fallback_chain:
    - "ollama/mistral:7b"                          # Local alternative
    - "ollama/llama3.2:3b"                         # Local lightweight
    - "google/gemini-2.5-flash"                    # CLOUD (non-sensitive only)

# ─── TOOLSETS ────────────────────────────────────────────────────
toolsets:
  - web
  - file
  - memory
  - vision       # For product photo analysis

# ─── ENVIRONMENT ─────────────────────────────────────────────────
env:
  HERMES_PROFILE: marjahans_merchant
  # No cloud keys needed for default LOCAL mode
  OLLAMA_HOST: "http://localhost:11434"
  # Optional cloud fallback
  GEMINI_API_KEY: "${GEMINI_API_KEY}"

# ─── SKILLS (6 specialized) ──────────────────────────────────────
skills:
  - product_storyteller
  - seo_optimizer
  - inventory_forecaster
  - campaign_builder
  - influencer_scout
  - competitor_watcher

# ─── CRON (4 jobs) ──────────────────────────────────────────────
cron:
  - schedule: "0 10 * * *"
    name: daily_inventory
    prompt: "Check Shopify inventory. Flag SKUs < 5 units. Suggest reorder."
  - schedule: "0 9 * * 1"
    name: weekly_email_campaign
    prompt: "Draft weekly Klaviyo email. Product story, customer testimonial, CTA."
  - schedule: "0 11 1 * *"
    name: monthly_competitor_scan
    prompt: "Scan top 5 competitors. Pricing, new products, campaigns. Recommend actions."
  - schedule: "0 14 * * *"
    name: daily_engagement
    prompt: "Reply to all IG DMs and comments. Engage 10 accounts in our niche."

# ─── MEMORY ───────────────────────────────────────────────────────
memory:
  enabled: true
  scope: "customer data, product catalog, campaign history (PRIVATE)"

# ─── PRIVACY ─────────────────────────────────────────────────────
privacy:
  mode: "LOCAL_FIRST"
  customer_pii_never_leaves_machine: true
  cloud_fallback_only_for: ["non-sensitive research", "trend analysis"]
  audit_log: "~/.hermes/profiles/marjahans_merchant/privacy.log"

# ─── NOTES ───────────────────────────────────────────────────────
notes: |
  [MARJAHANS] venture clone. Customer data = sacred.

  Default: Ollama Llama 3.1 8B (LOCAL, $0, 100% private)
  Why: Customer PII, orders, pricing never leave machine.
  Fallback: Other local models → Gemini Flash (only non-sensitive tasks)

  Use this profile for:
  - Product storytelling
  - Inventory forecasting
  - Email campaigns
  - Competitor research
  - Anything involving customer/order data
