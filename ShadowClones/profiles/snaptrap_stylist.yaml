# ═══════════════════════════════════════════════════════════════════
# Profile: snaptrap_stylist
# Purpose: [SNAPTRAP] venture — streetwear drops (DROP PLANS = PRIVATE)
# Created: 2026-06-06 · Updated: 2026-06-07 (free models)
# ═══════════════════════════════════════════════════════════════════

name: snaptrap_stylist
description: "Drop master + community builder for streetwear. [SNAPTRAP] venture. 100% LOCAL by default."

# ─── MODEL CONFIGURATION (FREE TIER — LOCAL FIRST) ──────────────
model:
  # Ollama local: drop plans + customer data stay private
  default: "ollama/llama3.1:8b"
  provider: ollama
  base_url: "http://localhost:11434/v1"
  fallback_chain:
    - "ollama/mistral:7b"                          # Local alternative
    - "ollama/llama3.2:3b"                         # Local lightweight
    - "meta-llama/llama-3.3-70b-instruct:free"     # CLOUD (for trend research only)

# ─── TOOLSETS ────────────────────────────────────────────────────
toolsets:
  - web
  - file
  - memory
  - vision       # For visual identity / mood boards

# ─── ENVIRONMENT ─────────────────────────────────────────────────
env:
  HERMES_PROFILE: snaptrap_stylist
  # No cloud keys needed for default LOCAL mode
  OLLAMA_HOST: "http://localhost:11434"
  # Optional cloud fallback
  OPENAI_API_KEY: "${OPENAI_API_KEY}"

# ─── SKILLS (6 specialized) ──────────────────────────────────────
skills:
  - trend_forecaster
  - drop_planner
  - community_builder
  - visual_identity_guard
  - collab_scout
  - pod_optimizer

# ─── CRON (3 jobs) ──────────────────────────────────────────────
cron:
  - schedule: "0 11 * * *"
    name: daily_culture_scan
    prompt: "Scan TikTok, IG, Pinterest, X. Identify trending aesthetics, sounds, hashtags. Log 5 trends."
  - schedule: "0 18 * * 3"
    name: weekly_community_check
    prompt: "Review IG DMs, comments, mentions. Engage top 20 accounts. Flag UGC."
  - schedule: "0 20 * * *"
    name: pre_drop_teaser
    prompt: "If drop is 7-14 days out: post teaser content. If < 24h: countdown."

# ─── MEMORY ───────────────────────────────────────────────────────
memory:
  enabled: true
  scope: "drop history, customer insights, design assets (PRIVATE)"

# ─── PRIVACY ─────────────────────────────────────────────────────
privacy:
  mode: "LOCAL_FIRST"
  drop_plans_never_leave_machine: true
  customer_data_never_leaves_machine: true
  cloud_fallback_only_for: ["trend research", "aesthetic analysis"]
  audit_log: "~/.hermes/profiles/snaptrap_stylist/privacy.log"

# ─── NOTES ───────────────────────────────────────────────────────
notes: |
  [SNAPTRAP] venture clone. Drop plans = sacred.

  Default: Ollama Llama 3.1 8B (LOCAL, $0, 100% private)
  Why: Drop plans, customer data, design concepts never leave machine.
  Fallback: Other local models → Llama 70B free (only trend research)

  Use this profile for:
  - Drop planning
  - Trend forecasting
  - Community engagement
  - Visual identity audits
  - Collab scouting
  - Print-on-demand optimization
