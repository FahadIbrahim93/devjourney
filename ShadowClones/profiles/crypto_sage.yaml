# ═══════════════════════════════════════════════════════════════════
# Profile: crypto_sage
# Purpose: [CRYPTO] venture — mining, trading, education
# Created: 2026-06-06 · Updated: 2026-06-07 (free models)
# ═══════════════════════════════════════════════════════════════════

name: crypto_sage
description: "Crypto market analyst + educator. Charts, on-chain, mining, sentiment. [CRYPTO] venture."

# ─── MODEL CONFIGURATION (FREE TIER) ─────────────────────────────
model:
  # Gemini Flash: best for vision (chart reading) + 1.5K req/day free
  default: "google/gemini-2.5-flash"
  provider: google
  base_url: "https://generativelanguage.googleapis.com/v1beta"
  fallback_chain:
    - "google/gemini-2.0-flash-exp:free"          # Free OpenRouter variant
    - "nvidia/nemotron-3-super-120b-a12b:free"   # Strong general fallback
    - "ollama/llama3.1:8b"                        # Local last-resort

# ─── TOOLSETS ────────────────────────────────────────────────────
toolsets:
  - terminal
  - file
  - web
  - search
  - vision      # For chart image analysis
  - memory

# ─── ENVIRONMENT ─────────────────────────────────────────────────
env:
  HERMES_PROFILE: crypto_sage
  GEMINI_API_KEY: "${GEMINI_API_KEY}"             # Direct Gemini (primary)
  OPENAI_API_KEY: "${OPENAI_API_KEY}"             # OpenRouter (fallback)

# ─── SKILLS (6 specialized) ──────────────────────────────────────
skills:
  - chart_pattern_recognition
  - onchain_flow_analysis
  - defi_yield_optimizer
  - mining_profitability
  - sentiment_tracker
  - ta_backtester

# ─── CRON (3 jobs) ──────────────────────────────────────────────
cron:
  - schedule: "0 9 * * *"
    name: morning_market_check
    prompt: "Analyze BTC/ETH overnight. Identify 3 chart patterns. Log to ShadowNetwork."
  - schedule: "0 18 * * 0"
    name: weekly_sentiment
    prompt: "Generate weekly sentiment report. Fear/Greed, funding rates, social trends."
  - schedule: "0 10 1 * *"
    name: monthly_mining_audit
    prompt: "Calculate mining profitability. ROI per rig. Recommend continue/upgrade/exit."

# ─── MEMORY ───────────────────────────────────────────────────────
memory:
  enabled: true
  scope: "crypto-specific (prices, on-chain, mining notes)"

# ─── NOTES ───────────────────────────────────────────────────────
notes: |
  [CRYPTO] venture clone.

  Default: Gemini 2.5 Flash (vision, 1.5K req/day)
  Why: Chart pattern recognition needs vision. Gemini free tier is the best.
  Fallback: OpenRouter :free models → local Ollama

  Use this profile for:
  - Chart image analysis (upload screenshot)
  - Daily 9 AM market scan
  - Crypto education content
  - Mining profitability calculations
