# ═══════════════════════════════════════════════════════════════════
# Profile: code_ninja
# Purpose: [CODE] venture — freelance + internal tools + AI agents
# Created: 2026-06-06 · Updated: 2026-06-07 (free models)
# ═══════════════════════════════════════════════════════════════════

name: code_ninja
description: "Vibe coder + freelance + AI agent builder. [CODE] venture."

# ─── MODEL CONFIGURATION (FREE TIER) ─────────────────────────────
model:
  # Qwen 2.5 Coder 32B: best free model specialized for code
  default: "qwen/qwen-2.5-coder-32b-instruct:free"
  provider: openrouter
  base_url: "https://openrouter.ai/api/v1"
  fallback_chain:
    - "nvidia/nemotron-3-super-120b-a12b:free"    # 80.2% SWE-Bench
    - "deepseek/deepseek-chat-v3-0324:free"       # Strong general
    - "ollama/qwen2.5-coder:7b"                   # Local code (privacy fallback)

# ─── TOOLSETS ────────────────────────────────────────────────────
toolsets:
  - terminal
  - file
  - code_execution
  - browser
  - memory
  - search

# ─── ENVIRONMENT ─────────────────────────────────────────────────
env:
  HERMES_PROFILE: code_ninja
  OPENAI_API_KEY: "${OPENAI_API_KEY}"             # OpenRouter

# ─── SKILLS (6 specialized) ──────────────────────────────────────
skills:
  - vibe_scaffold
  - api_orchestrator
  - ai_agent_builder
  - automation_script
  - freelance_deliverable
  - ollama_deployer

# ─── CRON (3 jobs) ──────────────────────────────────────────────
cron:
  - schedule: "0 18 * * 5"
    name: weekly_code_review
    prompt: "Review all active client projects. Update skill library. Identify reusable patterns."
  - schedule: "0 10 1 * *"
    name: monthly_skill_update
    prompt: "Scan new tools/frameworks. Update skills/ folder. Test in playground."
  - schedule: "0 20 * * *"
    name: daily_git_status
    prompt: "Check git status of all active repos. Flag uncommitted work > 24h."

# ─── MEMORY ───────────────────────────────────────────────────────
memory:
  enabled: true
  scope: "code-related (snippets, project notes, client work)"

# ─── NOTES ───────────────────────────────────────────────────────
notes: |
  [CODE] venture clone.

  Default: Qwen 2.5 Coder 32B (best free code model)
  Why: Specialized for code, tool use, debugging.
  Fallback: Nemotron (general strong) → DeepSeek V3 → local Qwen Coder

  Use this profile for:
  - Building features / scaffolding
  - API integration
  - AI agent construction
  - Automation scripts
  - Local Ollama deployment (its own skill)
