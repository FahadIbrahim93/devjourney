# ═══════════════════════════════════════════════════════════════════
# Profile: truth_seeker
# Purpose: [PHILO] venture — content + audience building
# Created: 2026-06-06 · Updated: 2026-06-07 (free models)
# ═══════════════════════════════════════════════════════════════════

name: truth_seeker
description: "Researcher + content engine + audience builder. [PHILO] venture."

# ─── MODEL CONFIGURATION (FREE TIER) ─────────────────────────────
model:
  # DeepSeek R1: best for reasoning chains + deep research
  default: "deepseek/deepseek-r1:free"
  provider: openrouter
  base_url: "https://openrouter.ai/api/v1"
  fallback_chain:
    - "meta-llama/llama-3.3-70b-instruct:free"     # Creative writing
    - "nvidia/nemotron-3-super-120b-a12b:free"    # General strong
    - "ollama/llama3.1:8b"                        # Local last-resort

# ─── TOOLSETS ────────────────────────────────────────────────────
toolsets:
  - web
  - file
  - memory
  - search
  - vision

# ─── ENVIRONMENT ─────────────────────────────────────────────────
env:
  HERMES_PROFILE: truth_seeker
  OPENAI_API_KEY: "${OPENAI_API_KEY}"

# ─── SKILLS (6 specialized) ──────────────────────────────────────
skills:
  - deep_researcher
  - content_engine
  - audience_builder
  - course_creator
  - trend_synthesizer
  - storyteller

# ─── CRON (4 jobs) ──────────────────────────────────────────────
cron:
  - schedule: "0 8 * * *"
    name: daily_research_scan
    prompt: "Scan crypto, history, philosophy, technology. Identify 3 macro patterns. Draft 1 thread."
  - schedule: "0 9 * * 0"
    name: weekly_newsletter
    prompt: "Draft weekly Substack. Connect 2-3 events to historical/philosophical pattern. 1500-2000 words."
  - schedule: "0 10 1 * *"
    name: monthly_audience_review
    prompt: "Analyze Substack, YouTube, X growth. Identify top-performing content. Recommend topics."
  - schedule: "0 12,18,21 * * *"
    name: daily_posting
    prompt: "Post 1 thread or tweet at peak time. Engage replies within 2 hours."

# ─── MEMORY ───────────────────────────────────────────────────────
memory:
  enabled: true
  scope: "research notes, content drafts, audience insights"

# ─── NOTES ───────────────────────────────────────────────────────
notes: |
  [PHILO] venture clone. Truth-seeking + content engine.

  Default: DeepSeek R1 (reasoning chains, free)
  Why: Research needs to show reasoning. R1 exposes the thinking process.
  Fallback: Llama 3.3 70B (creative) → Nemotron → local Ollama

  Use this profile for:
  - Deep research (multi-source synthesis)
  - Long-form content (Substack, threads)
  - Audience building strategy
  - Course creation
  - Trend synthesis
  - Storytelling
