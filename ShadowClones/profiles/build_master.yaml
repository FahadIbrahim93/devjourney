# ═══════════════════════════════════════════════════════════════════
# Profile: build_master
# Purpose: [BUILD] venture — real estate solutions
# Created: 2026-06-06 · Updated: 2026-06-07 (free models)
# ═══════════════════════════════════════════════════════════════════

name: build_master
description: "Network architect + proposal writer for real estate. [BUILD] venture."

# ─── MODEL CONFIGURATION (FREE TIER) ─────────────────────────────
model:
  # Qwen 72B: 128K context window — perfect for long proposals
  default: "qwen/qwen-2.5-72b-instruct:free"
  provider: openrouter
  base_url: "https://openrouter.ai/api/v1"
  fallback_chain:
    - "deepseek/deepseek-chat-v3-0324:free"       # 64K context, strong
    - "nvidia/nemotron-3-super-120b-a12b:free"    # Strong general
    - "ollama/llama3.1:8b"                        # Local last-resort

# ─── TOOLSETS ────────────────────────────────────────────────────
toolsets:
  - file
  - memory
  - search
  - browser
  - code_execution

# ─── ENVIRONMENT ─────────────────────────────────────────────────
env:
  HERMES_PROFILE: build_master
  OPENAI_API_KEY: "${OPENAI_API_KEY}"

# ─── SKILLS (6 specialized) ──────────────────────────────────────
skills:
  - proposal_writer
  - project_scoper
  - network_manager
  - cost_estimator
  - permit_navigator
  - innovation_scout

# ─── CRON (3 jobs) ──────────────────────────────────────────────
cron:
  - schedule: "0 9 * * 1"
    name: weekly_pipeline_review
    prompt: "Review all open proposals. Update CRM. Follow up on warm intros > 7 days old."
  - schedule: "0 10 1 * *"
    name: monthly_proposal_followup
    prompt: "Check status of all proposals sent > 30 days ago. Decide: pursue, archive, or warm up."
  - schedule: "0 8 * * *"
    name: daily_network_check
    prompt: "Check LinkedIn, email, WhatsApp for new contacts. Log to CRM. Identify warm intro paths."

# ─── MEMORY ───────────────────────────────────────────────────────
memory:
  enabled: true
  scope: "client list, project files, contact network"

# ─── NOTES ───────────────────────────────────────────────────────
notes: |
  [BUILD] venture clone. Real estate solutions.

  Default: Qwen 2.5 72B (128K context, free)
  Why: Proposals are long documents. Need big context window.
  Fallback: DeepSeek V3 (64K, strong) → Nemotron → local Ollama

  Use this profile for:
  - Writing proposals / RFPs
  - Project scoping
  - Cost estimation
  - Permit navigation
  - Network management
  - Construction innovation research
