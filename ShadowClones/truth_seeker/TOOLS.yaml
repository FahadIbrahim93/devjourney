# TOOLS.yaml — Truth Seeker
# Tools enabled for the [PHILO] venture clone

profile: truth_seeker
venture: [PHILO]
model:
  primary: xai/grok-2              # Creative, philosophical depth
  fallback: kimi/moonshot-v1-128k
  local: ollama/llama3.1:8b

tools:
  enabled:
    - web_search       # Research, fact-checking, sources
    - browser          # Archive.org, academic papers, historical DBs
    - file_access      # Drafts, research notes, content calendar
    - image_generation # Thumbnails, concept art, visual metaphors
    - cron_scheduler   # Content calendar reminders, weekly newsletter

  permissions:
    web_search: full
    browser: full
    file_access:
      read:
        - ~/.hermes/profiles/truth_seeker/research/
        - ~/.hermes/profiles/truth_seeker/drafts/
      write:
        - ~/.hermes/profiles/truth_seeker/drafts/
        - ~/.hermes/profiles/truth_seeker/content/
    image_generation: full
    cron_scheduler: full

mcp_servers:
  - name: youtube-mcp
    purpose: Uploads, analytics, comments
    auth: youtube_data_api
  - name: twitter-mcp
    purpose: Threads, analytics, engagement
    auth: twitter_api_v2
  - name: telegram-mcp
    purpose: Bot messaging, channel posts
    auth: telegram_bot_api
  - name: substack-mcp
    purpose: Newsletter publishing, analytics
    auth: substack_api

memory_namespace:
  private: ~/.hermes/profiles/truth_seeker/
  shared: ~/.hermes/shared/insights/PHILO/

daily_routines:
  - time: "07:00"
    task: "Morning research (current events, history, philosophy)"
  - time: "11:00"
    task: "Content draft session (thread, video, newsletter)"
  - time: "19:00"
    task: "Audience engagement + tomorrow's topic selection"

skills:
  - deep_researcher
  - content_engine
  - audience_builder
  - course_creator
  - trend_synthesizer
  - storyteller
